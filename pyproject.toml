[project]
name = "personalfinances"
version = "1.1.1"
description = "Personal finance dashboard: replays an append-only ledger into IBKR portfolio performance, net worth, budgets, and goals."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Gabriel Duguey", email = "g630du@gmail.com" },
]
dependencies = [
    "polars>=1.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "numpy>=1.26",
    "defusedxml>=0.7",
    "pdfplumber>=0.11",
    "python-dateutil>=2.9",
    "fastexcel>=0.12",
    "boto3>=1.43.42",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "cryptography>=45.0.0,<49.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "clerk-backend-api>=6.0.1,<7.0.0",
    "svix>=1.96.1",
]
llm = [
    "google-genai>=1.0",
    "mistralai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.14",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "httpx>=0.27",
    "plotly>=5.22",
    "xlsxwriter>=3.2",
    "mypy>=2.2.0",
]

[project.urls]
Repository = "https://github.com/gduguey/FinanceDashboard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trades", "src/accounting", "src/db"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true
packages = ["trades", "accounting", "db"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["plotly.*", "defusedxml.*", "pdfplumber.*", "dateutil.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 120
preview = true
exclude = ["examples/", "*.ipynb", "src/migration/"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # missing-trailing-comma
    "CPY001",  # Missing copyright notice at top of file
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D203",    # blank line required before class docstring
    "D211",    # no-blank-line-before-class
    "D213",    # multi-line-summary-second-line
    "EM101",   # raw-string-in-exception
    "FIX002",  # line-contains-todo
    "ISC001",  # Conflicts with formatter ruff
    "PLR0904", # Too many public methods (... > 20)
    "TD002",   # Missing author in TODO `# TODO(<author_name>): ...`
    "TD003",   # missing-todo-link
    "TRY003",  # raise-vanilla-args
]
fixable = ["ALL"]
unfixable = [
    # "D", # Dont fix docstyle from others
    # "I", # we run isort separately
]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 7  # symbol/date-range/config/behavior-flag/session-override functions commonly need 6-7

[tool.ruff.lint.per-file-ignores]
"**/models.py" = [
    "TC001",   # pydantic needs these types at runtime to build the schema, not just for type-checking
    "TC002",
    "TC003",
    "RUF012",  # SQLAlchemy's own `__table_args__` convention is a plain dict/tuple class attribute, not instance state
]

"src/accounting/db/*.py" = [
    "TC001",   # SQLAlchemy's declarative mapping resolves `Mapped[...]` annotations at runtime too, same reason as models.py
    "TC002",
    "TC003",
    "RUF012",  # SQLAlchemy's own `__table_args__` convention is a plain dict/tuple class attribute, not instance state
]

"**/config.py" = [
    "TC001",   # same as models.py: pydantic resolves annotations at runtime
    "TC002",
    "TC003",
]

"**/dashboard/settings.py" = [
    "TC001",   # DashboardSettings is a pydantic model too; same reason as models.py/config.py
    "TC002",
    "TC003",
]

"**/accounting/api/**/*.py" = [
    "TC001",   # FastAPI's Depends() resolves `Session`'s annotation at runtime too, same reason as models.py/config.py
    "TC002",
    "TC003",
]

"**/trades/api/**/*.py" = [
    "TC001",   # Same as accounting/api: FastAPI's Depends() resolves `Session`'s annotation at runtime too
    "TC002",
    "TC003",
]

"**/test_*.py" = [
    "ANN",     # Type annotation strictness is lower-value in tests
    "D",       # Docstring requirements are unnecessary for tests
    "DOC",     # pydoclint return/arg doc requirements are unnecessary for tests
    "DTZ",     # Naive datetimes are often intentional in deterministic tests
    "E501",    # Test readability can outweigh strict line length
    "I001",    # Import auto-formatting is lower-value for test snippets
    "INP001",  # tests/ is a package (see __init__.py files) but this ignore is harmless if that ever changes
    "S101",    # asserts allowed in tests...
    "ARG",     # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT",     # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "PLR0913", # More test parameters are common with fixtures
    "PLR0917", # Same as PLR0913, for positional-only counting
    "PLR2004", # Magic value used in comparison, ...
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
    "SLF001",  # Tests may need private access for behavior validation
    "PLC2701", # Import-level equivalent of SLF001 above — tests may import a private name directly
    "W292",    # Trailing newline formatting noise in tests
    "PLR6301",  # Unused self in function.
]

"**/conftest.py" = [
    "ANN",     # Type annotation strictness is lower-value in fixture files
    "D",       # Docstring requirements are unnecessary for fixture files
    "DOC",     # pydoclint return/arg doc requirements are unnecessary for fixtures
    "DTZ",     # Naive datetimes are often intentional in deterministic fixtures
    "E501",    # Fixture readability can outweigh strict line length
    "I001",    # Import auto-formatting is lower-value for fixture files
    "INP001",  # tests/ is a package (see __init__.py files) but this ignore is harmless if that ever changes
    "S101",    # asserts allowed in tests...
    "ARG",     # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT",     # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "PLR0913", # More fixture parameters are common
    "PLR0917", # Same as PLR0913, for positional-only counting
    "PLR2004", # Magic value used in comparison, ...
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
    "SLF001",  # Fixtures/tests may access internals intentionally
    "W292",    # Trailing newline formatting noise in fixtures
    "PLR6301",  # Unused self in function.
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
