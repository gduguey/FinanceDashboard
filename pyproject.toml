[project]
name = "trades"
version = "0.1.0"
description = "Trade blotter enrichment, price history caching, and return-vs-benchmark reporting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "plotly>=5.22",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbclient>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trades"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
