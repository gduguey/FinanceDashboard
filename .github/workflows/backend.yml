name: backend

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      # DATABASE_URL_APP is needed even though this job runs no migration of its
      # own: tests/db/test_rls_coverage.py migrates its own scratch database, and
      # the baseline creates the restricted app_runtime role from this URL's
      # password. Without it those tests error out instead of running.
      - name: pytest
        env:
          DATABASE_URL_TEST: postgresql+psycopg://postgres:postgres@localhost:5432/test
          DATABASE_URL_APP: postgresql+psycopg://app_runtime:ci-app-runtime-password@localhost:5432/test
        run: uv run pytest

  migrations:
    name: Migrations apply and match the models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --locked

      # The suite builds its schema with `Base.metadata.create_all`, which creates
      # no policies and never runs a migration. Without this job the baseline is
      # only ever verified on a developer's laptop, and model/migration drift is
      # structurally undetectable.
      - name: Apply migrations to an empty database
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/migrations
          DATABASE_URL_APP: postgresql+psycopg://app_runtime:ci-app-runtime-password@localhost:5432/migrations
        run: uv run alembic upgrade head

      # Autogenerate must produce an empty diff: the migrated schema and the ORM
      # metadata cannot drift apart without this failing.
      - name: Assert the migrated schema matches the models
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/migrations
          DATABASE_URL_APP: postgresql+psycopg://app_runtime:ci-app-runtime-password@localhost:5432/migrations
        run: uv run alembic check

      # Two halves of the same guarantee, against a migrated scratch database:
      # coverage proves every tenant table *has* a forced policy, isolation
      # proves those policies work — as the restricted `app_runtime` role, for
      # reads and writes both (see tests/db/test_rls_isolation.py).
      - name: Row-Level Security coverage and isolation
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/migrations
          DATABASE_URL_APP: postgresql+psycopg://app_runtime:ci-app-runtime-password@localhost:5432/migrations
          DATABASE_URL_TEST: postgresql+psycopg://postgres:postgres@localhost:5432/migrations
        run: uv run pytest tests/db/test_rls_coverage.py tests/db/test_rls_isolation.py -v

      - name: Migrations are reversible
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/migrations
          DATABASE_URL_APP: postgresql+psycopg://app_runtime:ci-app-runtime-password@localhost:5432/migrations
        run: uv run alembic downgrade base

  performance:
    name: Read-path latency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --locked

      # Deselected from the default run (see pyproject.toml's addopts), so
      # this job is the only place the latency gate executes. Without it the
      # suite would be carrying a test nothing ever runs.
      - name: Paginated read paths stay within their latency budget
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/perf
          DATABASE_URL_APP: postgresql+psycopg://app_runtime:ci-app-runtime-password@localhost:5432/perf
          DATABASE_URL_TEST: postgresql+psycopg://postgres:postgres@localhost:5432/perf
        run: uv run pytest -m perf -v -s

  version-check:
    name: Version bump check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch main
        run: git fetch origin main --depth=1

      - name: Verify version was bumped, not dropped
        run: |
          BASE_VERSION=$(git show origin/main:pyproject.toml | grep -m1 '^version = ' | sed -E 's/version = "(.*)"/\1/')
          PR_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "main: $BASE_VERSION -> this PR: $PR_VERSION"

          if [ "$PR_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::version in pyproject.toml wasn't bumped (still $BASE_VERSION)"
            exit 1
          fi

          HIGHEST=$(printf '%s\n%s\n' "$BASE_VERSION" "$PR_VERSION" | sort -V | tail -n1)
          if [ "$HIGHEST" != "$PR_VERSION" ]; then
            echo "::error::version dropped: $BASE_VERSION -> $PR_VERSION"
            exit 1
          fi

          echo "version bumped: $BASE_VERSION -> $PR_VERSION"

  tag:
    name: Tag release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag if version changed
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          TAG="v$VERSION"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists, nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
