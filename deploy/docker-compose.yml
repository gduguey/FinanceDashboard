services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # From the invoking shell's env (deploy.sh exports it from .env.docker
      # before calling `docker compose up --build`) — Compose's own `${...}`
      # interpolation never reads .env.docker itself, only a literal `.env`
      # or the shell environment, same gotcha as APP_VERSION below.
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    # Tags the built image with the app's own version (see
    # docs/server-setup/versioning.md) so `docker images`/`docker inspect`
    # can show exactly what's running, not just whatever `git log` says on
    # the VM. `deploy.sh` sets APP_VERSION from pyproject.toml; falls back
    # to `dev` for a plain local `docker compose up --build`.
    image: financedashboard-api:${APP_VERSION:-dev}

    container_name: finance-dashboard
    restart: unless-stopped

    env_file:
      - ../.env.docker

    depends_on:
      postgres:
        condition: service_healthy

    # Not published to the host — only reachable from other containers on
    # this compose network. Caddy is the only thing the internet can reach.
    expose:
      - "8000"

    volumes:
      # Transitional: local file-based data, until Postgres + R2 fully take over.
      - ../data:/app/data

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M
        reservations:
          cpus: "0.5"
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: finance-postgres
    restart: unless-stopped

    # env_file alone is enough — it injects POSTGRES_DB/USER/PASSWORD from
    # .env.docker directly into the container's runtime environment, which is
    # what the official postgres image reads on startup.
    env_file:
      - .env.docker

    # No `ports:` entry on purpose — Postgres is never exposed to the host's
    # public interface, only reachable from other containers on this network.
    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      # $$ (not $) escapes Compose's own file-level interpolation (which only
      # reads a file literally named `.env`, not `.env.docker`) so these are
      # expanded by the container's shell at runtime from its real env instead.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: finance-caddy
    restart: unless-stopped

    depends_on:
      - api

    env_file:
      - ../.env.docker

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
